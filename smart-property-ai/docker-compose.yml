services:
  db:
    build: ./docker/postgres
    container_name: spm-postgis
    environment:
      POSTGRES_USER: spm
      POSTGRES_PASSWORD: spm_password
      POSTGRES_DB: smart_property
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spm -d smart_property"]
      interval: 5s
      retries: 10

  api:
    build: .
    container_name: spm-api
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://spm:spm_password@db:5432/smart_property?schema=public
    ports:
      - "4000:4000"
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
